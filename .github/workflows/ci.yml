name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      # Runs after the build so the public-surface check has declaration files
      # to inspect rather than skipping.
      - name: Architecture invariants
        run: pnpm invariants

      - name: Test
        run: pnpm test

      # Generated sources are committed, so a hand edit or a stale regeneration
      # must fail here rather than reaching a release. Re-emitting from the
      # committed schema needs no network.
      - name: Generated code is in sync
        run: |
          pnpm --filter @yuigram/schema regenerate:offline
          if ! git diff --quiet -- packages/*/src/generated; then
            echo "::error::Generated code differs from the committed schema. Run the schema tool and commit the result."
            git --no-pager diff --stat -- packages/*/src/generated
            exit 1
          fi
          echo "Generated code matches the committed schema." 

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Everything in the Verify job imports through workspace paths, where a
      # broken exports map, a file left out of `files`, or a subpath that
      # resolves at compile time but not at run time are all invisible. This
      # installs the tarballs and uses them as an application would, so a
      # packaging break is caught here rather than on release day.
      - name: Smoke test the published packages
        run: pnpm smoke

  provenance:
    name: Independence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The dependency tree is the load-bearing claim: Yuigram implements both
      # protocols itself. A Telegram library entering at any depth, even
      # transitively, breaks that and must fail the build.
      - name: No Telegram library in the dependency tree
        run: |
          set -euo pipefail
          forbidden='puregram|mtcute|grammy|grammyjs|telegraf|teleproto|gramio|tgsnake|node-telegram-bot-api'
          if pnpm ls --recursive --depth Infinity --parseable 2>/dev/null \
             | grep -Ei "node_modules/(@)?($forbidden)"; then
            echo "::error::A Telegram library is present in the dependency tree."
            exit 1
          fi
          echo "No Telegram library found in the dependency tree."

      # Guards against copyleft arriving through a transitive dependency. With
      # zero runtime dependencies this passes trivially — which is the point,
      # and the check is here for the day that changes.
      - name: Licence gate
        run: |
          set -uo pipefail
          output=$(pnpm licenses list --prod --json 2>&1) || true

          if ! printf '%s' "$output" | head -c1 | grep -q '[{[]'; then
            echo "No runtime dependencies to audit."
            echo "$output"
            exit 0
          fi

          printf '%s' "$output" > licenses.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const allowed = new Set([
              'MIT','ISC','BSD-2-Clause','BSD-3-Clause','Apache-2.0','0BSD','CC0-1.0','Unlicense',
            ])
            const raw = JSON.parse(readFileSync('licenses.json','utf8'))
            const bad = Object.keys(raw).filter((l) => !allowed.has(l))
            if (bad.length > 0) {
              console.error('Disallowed runtime licence(s): ' + bad.join(', '))
              process.exit(1)
            }
            console.log('All runtime licences are on the allowlist.')
          "
