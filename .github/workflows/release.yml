name: Release

# Manual-only until the first release (Phase 4). The packages are at 0.0.0 and
# there is nothing to publish; a push trigger would fail on every commit and
# train everyone to ignore a red workflow.
#
# Switch to `push: branches: [main]` when the Bot API subsystem is ready to
# ship, so changesets can open release pull requests automatically.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance attestation, so published artifacts are
      # verifiably built from this repository at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing anything that has not passed every gate would defeat the
      # point of having the gates.
      - name: Verify
        run: pnpm verify

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
