name: Release

# Manual-only for the first release. Running it twice is the whole flow: the
# first run opens a "chore: version packages" pull request, and the run after
# that pull request is merged publishes what it contains. Reviewing that pull
# request is the last point at which a version number can still be changed.
#
# Switch to `push: branches: [main]` once 0.1.0 is out, so the version pull
# request opens by itself whenever a changeset lands on main.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance attestation, so published artifacts are
      # verifiably built from this repository at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Fails in seconds rather than after the build, and catches an expired or
      # revoked token before anything has been built. Granular npm tokens
      # expire, so this will eventually be the step that tells you why.
      - name: Check the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_SECRET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::No npm token. Set NPM_TOKEN (or NPM_SECRET_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::The npm token is set but the registry rejected it. It may be expired, revoked, or scoped too narrowly."
            exit 1
          fi
          echo "Authenticated to npm as $(npm whoami)."

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing anything that has not passed every gate would defeat the
      # point of having the gates.
      - name: Verify
        run: pnpm verify

      # The only check that sees what a user receives. Everything above imports
      # through workspace paths, where a broken exports map or a file left out
      # of `files` is invisible.
      - name: Smoke test the packages
        run: pnpm smoke

      # Looks inside the tarballs. `files` is an allowlist, which is the safe
      # direction, but nothing else checks what ends up in the archive - and
      # the moment after a credential reaches a registry is the wrong moment to
      # find out.
      - name: Check what the packages contain
        run: node scripts/check-package-contents.mjs

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_SECRET_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
