# Dependency updates.
#
# The published packages have zero runtime dependencies, so nothing here
# affects what users install — this covers the build toolchain and the actions
# the workflows run.
#
# Everything is grouped and monthly on purpose. Ungrouped weekly updates on a
# small project produce a stream of pull requests nobody reads, and a review
# habit that decays is worse than a slower cadence.
version: 2

updates:
  # The build toolchain: TypeScript, Biome, Vitest, tsx, changesets.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      toolchain:
        patterns: ['*']

  # Actions pinned in the workflows. These matter more than the toolchain:
  # a stale action is a supply-chain surface on every run, including release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
