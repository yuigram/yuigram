name: Feature request
description: Propose a capability or an API change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/roadmap.md` first — the feature may already be planned for a later phase.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
